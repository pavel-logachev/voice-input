name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VoiceInput.sln

      - name: Build
        run: dotnet build VoiceInput.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VoiceInput.sln --configuration Release --no-build --verbosity normal
