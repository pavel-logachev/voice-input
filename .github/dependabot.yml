version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
    # NAudio 3 меняет API записи звука: переход делается отдельно, с проверкой на микрофоне.
    ignore:
      - dependency-name: NAudio
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
